name: "[DevX AI & Automation] Google Chats PR Announcer"

on:
  workflow_dispatch:
  schedule:
    # Every weekday morning at 7 AM
    # See https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: "0 7 * * MON-FRI"
      timezone: "Europe/London"

permissions: {}

jobs:
  # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-defining-outputs-for-a-job
  setup:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.main.outputs.repos }}
    steps:
      - id: main
        # See https://github.com/orgs/guardian/teams/devx-ai-and-automation/repositories
        run: |
          REPOS=(
            devenv
            agentsy
          )

          RESULT=""
          for repo in "${REPOS[@]}"; do
            RESULT="$RESULT,guardian/$repo"
          done

          # remove leading ,
          RESULT="${RESULT:1}"
          echo "repos=$RESULT" >> $GITHUB_OUTPUT
  prnouncer:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Use GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          # These values are for the GitHub App "Gu PRnouncer config"
          # See https://github.com/organizations/guardian/settings/apps/gu-prnouncer-config (only accessible by GitHub owners)
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: guardian

      - uses: guardian/actions-prnouncer@main
        with:
          google-webhook-url: ${{ secrets.DEVX_SECURITY_GOOGLE_WEBHOOK_URL }}
          github-repositories: ${{ needs.setup.outputs.repos }}
          github-token: ${{ steps.app-token.outputs.token }} # A GitHub app token generated by the previous step
          # Exclude PRs from Dependabot (49699333), Scala Steward public (108136057), and Scala Steward private (108460179)
          github-ignored-users: "49699333,108136057,108460179"
          show-pr-age: "true"

      - name: Get current day
        # We use %a for 'Mon', 'Tue', etc.
        run: echo "CURRENT_DAY=$(date +'%a')" >> $GITHUB_ENV

      - name: Announce dependency update PRs
        # Only run on Mondays to avoid daily noise from dependency bots (or on manual execution)
        if: github.event_name == 'workflow_dispatch' || env.CURRENT_DAY == 'Mon'
        uses: guardian/actions-prnouncer@main
        with:
          google-webhook-url: ${{ secrets.DEVX_SECURITY_GOOGLE_WEBHOOK_URL }}
          github-repositories: ${{ needs.setup.outputs.repos }}
          github-token: ${{ steps.app-token.outputs.token }} # A GitHub app token generated by the previous step
          # Only include PRs from Dependabot (49699333), Scala Steward public (108136057), and Scala Steward private (108460179)
          github-announced-users: "49699333,108136057,108460179"
          # Override default which ignores Dependabot
          github-ignored-users: ""
          show-pr-age: "true"
